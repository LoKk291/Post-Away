<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Unsecured Content-Security-Policy to allow local file:// images -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>Post-Away Automator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <h1>Post-Away Automator</h1>
            <div class="actions">
                <button id="btn-select" class="btn primary-btn">Seleccionar Carpeta Principal</button>
            </div>
        </header>
        
        <main>
            <div id="path-indicator" class="hidden">
                <span>Carpeta Actual: </span>
                <span id="current-path" class="path-text"></span>
            </div>

            <section class="global-settings glass-panel hidden" id="global-settings">
                <h2>Configuraciones Generales</h2>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="global-date">Fecha de Programación (DD/MM/AA)</label>
                        <input type="date" id="global-date" class="glass-input">
                    </div>
                    <div class="setting-item">
                        <label for="global-time">Hora (24hs)</label>
                        <input type="time" id="global-time" class="glass-input">
                    </div>
                </div>
                <!-- Statistics UI -->
                <div class="stats-panel" id="stats-panel" style="margin-top: 1.5rem; display: flex; gap: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
                    <div class="setting-item">
                        <span class="info-label" style="color: #60a5fa;">Posts Totales</span>
                        <span class="info-value title-value" style="font-size: 1.25rem;" id="stat-posts">0</span>
                    </div>
                    <div class="setting-item">
                        <span class="info-label" style="color: #60a5fa;">Imágenes Totales a subir</span>
                        <span class="info-value title-value" style="font-size: 1.25rem;" id="stat-images">0</span>
                    </div>
                </div>
                <button id="btn-auto-all" class="btn primary-btn" style="width: 100%; margin-top: 1.5rem; background: linear-gradient(135deg, #10b981, #059669); font-size: 1.1rem; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);">🚀 Iniciar Súper Automatización (Cola de Pendientes)</button>
            </section>
            
            <div id="posts-grid" class="posts-grid">
                <div class="empty-state">
                    Selecciona una carpeta para comenzar a organizar tus posts.
                </div>
            </div>
        </main>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
